services:
  openclaw-bot:
    image: openclaw-local:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-openclaw
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Disable mDNS broadcasting on local network
      OPENCLAW_DISABLE_BONJOUR: "1"
      # Skip device pairing for internal tool calls (Docker has no interactive pairing)
      OPENCLAW_SKIP_PAIRING: "1"
      OPENCLAW_TRUST_LOCAL_DEVICES: "1"
      OPENCLAW_NO_RESPAWN: "1"
    ports:
      - "127.0.0.1:18789:18789"
      - "0.0.0.0:18790:18790"   # SMS webhook receiver (needs to be reachable from SMS Gateway cloud)
    volumes:
      - openclaw_data:/home/clawuser/.openclaw
      - openclaw_workspace:/home/clawuser/workspace
      - ./credentials:/home/clawuser/credentials:ro
      - ./credentials/himalaya.toml:/home/clawuser/.config/himalaya/config.toml:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_ADMIN
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          memory: 512M

volumes:
  openclaw_data:
  openclaw_workspace:
